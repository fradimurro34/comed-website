<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-labelledby="offTitle">
  <title id="offTitle">Illustrazione stilizzata di un disegno tecnico d'ufficio</title>
  <defs>
    <linearGradient id="offBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2F2F0"/>
      <stop offset="100%" stop-color="#E8E8E6"/>
    </linearGradient>
    <pattern id="offGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#D6D6D3" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="600" height="340" rx="16" fill="url(#offBg)"/>
  <rect width="600" height="340" rx="16" fill="url(#offGrid)"/>

  <!-- drawing sheet -->
  <rect x="60" y="50" width="360" height="240" rx="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3"/>
  <rect x="80" y="70" width="320" height="200" fill="none" stroke="#D6D6D3" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- mechanical part draft: flanged shaft cross-section -->
  <g stroke="#1A1A1A" stroke-width="3" fill="none" stroke-linejoin="round">
    <rect x="150" y="140" width="160" height="60" rx="4"/>
    <line x1="150" y1="160" x2="130" y2="160"/>
    <line x1="150" y1="180" x2="130" y2="180"/>
    <line x1="310" y1="140" x2="360" y2="120"/>
    <line x1="310" y1="200" x2="360" y2="220"/>
  </g>
  <circle cx="230" cy="170" r="18" fill="none" stroke="#E69113" stroke-width="3"/>
  <circle cx="230" cy="170" r="4" fill="#E69113"/>

  <!-- dimension lines -->
  <g stroke="#5C5C5C" stroke-width="1.2">
    <line x1="150" y1="215" x2="310" y2="215"/>
    <line x1="150" y1="210" x2="150" y2="220"/>
    <line x1="310" y1="210" x2="310" y2="220"/>
  </g>
  <text x="230" y="232" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#5C5C5C">160.00 mm</text>
  <text x="230" y="120" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#5C5C5C">&#8960; 36.00 &#177;0.01</text>

  <!-- drafting compass tool -->
  <g transform="translate(460,190) rotate(-18)" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="0" y1="0" x2="-34" y2="70"/>
    <line x1="0" y1="0" x2="34" y2="70"/>
    <circle cx="0" cy="0" r="6" fill="#E69113" stroke="none"/>
    <circle cx="-34" cy="70" r="3" fill="#1A1A1A" stroke="none"/>
  </g>

  <!-- pencil -->
  <g transform="translate(430,250) rotate(28)" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round" fill="#E69113">
    <rect x="0" y="0" width="70" height="12" rx="2" fill="#E69113" stroke="#1A1A1A"/>
    <path d="M70 0 L84 6 L70 12 Z" fill="#1A1A1A" stroke="none"/>
  </g>
</svg>
